version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dandiya-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dandiya_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dandiya-backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/dandiya_db
      - DB_NAME=dandiya_db
      - JWT_SECRET=dandiya-navratri-e2ee-jwt-super-secret-key-2026
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_ORIGIN=http://localhost:5173
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dandiya-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
